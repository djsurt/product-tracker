# Production stack for the EC2 host. Uses the prebuilt ECR image (no build),
# and drops dev-only services (postgres/redis are managed; mock-store/mailhog
# are dev tools). Config comes from /opt/deal-hunter/.env rendered at boot.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      MODEL3D_STORAGE_DIR: /data/model3d
    volumes:
      - model3d:/data/model3d
    expose:
      - "8000"

  worker:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      MODEL3D_STORAGE_DIR: /data/model3d
      # Free-tier price-source APIs (eBay Browse, RapidAPI) throttle hard. Keep
      # our call volume gentle so a background sweep never blows their quota and
      # 429s every real request. See REFRESH_INTERVAL_SECONDS on beat below.
      SOURCE_RATE_LIMIT_PER_SEC: "1"
    volumes:
      - model3d:/data/model3d

  beat:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    command: celery -A workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      # Sweep every 30 min, not every 30s. A personal price tracker needs only a
      # handful of checks per item per day; a tight cadence just exhausts the
      # free-tier source quotas and leaves every item stuck on "checking…".
      REFRESH_INTERVAL_SECONDS: "1800"
      SOURCE_RATE_LIMIT_PER_SEC: "1"

volumes:
  caddy_data:
  caddy_config:
  # Generated 3D model files (glb/usdz) — written by worker, served by web.
  model3d:
