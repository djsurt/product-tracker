{% extends "base.html" %}
{% block title %}Log in · Deal Hunter{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:48px auto;">
  <h1>Log in</h1>
  <form method="post" action="/login">
    <div style="margin-bottom:12px;">
      <label for="email">Email</label>
      <input class="grow" style="width:100%" id="email" name="email" type="email" required autofocus>
    </div>
    <div style="margin-bottom:16px;">
      <label for="password">Password</label>
      <input class="grow" style="width:100%" id="password" name="password" type="password" required>
    </div>
    <button type="submit" style="width:100%">Log in</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
  <p class="muted" style="margin-top:16px;">No account? <a href="/register">Register</a></p>
</div>
{% endblock %}
