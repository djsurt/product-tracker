<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="description" content="Keep a little wishlist. Find a better price. Deal Hunter watches the things you love across stores.">
  <title>{% block title %}Deal Hunter{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b94e32' d='M12.6 2.6a2 2 0 0 1 1.4-.6H20a2 2 0 0 1 2 2v6a2 2 0 0 1-.6 1.4l-9 9a2 2 0 0 1-2.8 0l-6-6a2 2 0 0 1 0-2.8z'/%3E%3Ccircle cx='17' cy='7' r='1.8' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=2">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2"></script>
  <script src="/static/app.js?v=2" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/app" class="brand" aria-label="Deal Hunter home">
        <span class="brand-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3h7a1 1 0 0 1 1 1v7L11 21 3 13Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="17" cy="7" r="1.5" fill="currentColor"/></svg></span>
        Deal Hunter<span class="brand-period">.</span>
      </a>
      {% if user %}
      <details class="account-menu popover">
        <summary aria-label="Account menu"><span class="avatar">{{ user.email[0] | upper }}</span><span class="account-label">My account</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></summary>
        <div class="popover-panel">
          <p class="account-email">{{ user.email }}</p>
          <a href="/app/ops" {% if request.url.path.startswith('/app/ops') %}aria-current="page"{% endif %}>Pipeline dashboard</a>
          <form method="post" action="/logout"><button class="ghost" type="submit">Log out <span aria-hidden="true">↗</span></button></form>
        </div>
      </details>
      {% else %}
      <nav class="auth-nav" aria-label="Account navigation"><a href="/login">Log in</a><a href="/register" class="btn secondary">Get started <span aria-hidden="true">↗</span></a></nav>
      {% endif %}
    </div>
  </header>
  <main id="main" class="container" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer class="foot"><a class="footer-brand" href="/app">Deal Hunter<span>.</span></a><span>A little less scrolling. A little more saving.</span><span class="footer-note">Made for the things you love.</span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript-note">Enable JavaScript to add products and receive live price updates.</p></noscript>
</body>
</html>
