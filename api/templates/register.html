{% extends "base.html" %}
{% block title %}Register · Deal Hunter{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:48px auto;">
  <h1>Create account</h1>
  <form method="post" action="/register">
    <div style="margin-bottom:12px;">
      <label for="email">Email</label>
      <input style="width:100%" id="email" name="email" type="email" required autofocus>
    </div>
    <div style="margin-bottom:16px;">
      <label for="password">Password (min 8 chars)</label>
      <input style="width:100%" id="password" name="password" type="password" minlength="8" required>
    </div>
    <button type="submit" style="width:100%">Register</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
  <p class="muted" style="margin-top:16px;">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
