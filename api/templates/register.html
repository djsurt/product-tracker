{% extends "base.html" %}
{% block title %}Register · Deal Hunter{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Start hunting deals</h1>
  <p class="lead" style="margin-bottom:20px;">Create an account and let us watch prices for you.</p>
  <form method="post" action="/register" class="stack">
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required autofocus>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <p class="hint" style="margin-top:6px;">At least 8 characters.</p>
    </div>
    <button type="submit" style="width:100%">Create account</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
  <p class="hint" style="margin-top:18px;">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
