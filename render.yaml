# Render blueprint (Phase 6) — one file describing the whole deployment.
#
# `render blueprint launch` (or connecting the repo in the Render dashboard)
# provisions: a managed Postgres, a managed Redis (Key Value), and three
# services that share ONE Docker image but run different commands —
#   web   : the FastAPI app (API + HTMX UI)
#   worker: Celery workers (price fetching, notifications)
#   beat  : the Celery scheduler
#
# This is the cloud mirror of docker-compose.yml. Secrets you must set in the
# dashboard after launch: JWT_SECRET (generate one) and the SMTP_* / source API
# keys you actually want live. DATABASE_URL and REDIS_URL are wired in here from
# the managed resources via fromDatabase / fromService.

databases:
  - name: deal-hunter-db
    databaseName: deals
    user: deals
    plan: free

services:
  # Managed Redis (broker + cache + rate-limit + metrics counters).
  - type: keyvalue
    name: deal-hunter-redis
    plan: free
    ipAllowList: []   # only reachable from other Render services

  # API + HTMX frontend.
  - type: web
    name: deal-hunter-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Run migrations on deploy, then serve.
    dockerCommand: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars: &shared_env
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: deal-hunter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: deal-hunter-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true       # Render mints a strong secret
      - key: APP_BASE_URL
        sync: false               # set to the public web URL after first deploy
      - key: SCRAPER_ENABLED
        value: "false"
      # SMTP_* and source API keys: add in the dashboard (sync:false) when wanted.

  # Celery workers — scale `numInstances` up for more throughput.
  - type: worker
    name: deal-hunter-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A workers.celery_app worker --loglevel=info
    numInstances: 1
    envVars: *shared_env

  # Celery Beat — exactly one instance (it's the single scheduler).
  - type: worker
    name: deal-hunter-beat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A workers.celery_app beat --loglevel=info
    numInstances: 1
    envVars: *shared_env
